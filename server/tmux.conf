# ---------------------------------------------------------
# 1. THE PREFIX KEY
# ---------------------------------------------------------
# Change the default prefix from the awkward 'Ctrl+B' to 'Ctrl+A'
# (This is much easier to reach with one hand)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ---------------------------------------------------------
# 2. QUALITY OF LIFE
# ---------------------------------------------------------
# Enable Mouse Mode (Click to select panes, resize borders, scroll history)
set -g mouse on

# Start counting panes and windows at 1 instead of 0
# (Your keyboard numbers start at 1, so your windows should too)
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Quickly reload this config file without restarting tmux (Prefix + r)
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"
set -g escape-time 0

# ---------------------------------------------------------
# 3. INTUITIVE SPLITTING
# ---------------------------------------------------------
# Use | to split horizontally (side by side)
bind | split-window -h -c "#{pane_current_path}"
# Use - to split vertically (top and bottom)
bind - split-window -v -c "#{pane_current_path}"
# Unbind the confusing default keys
unbind '"'
unbind %

# ---------------------------------------------------------
# 4. EASY NAVIGATION
# ---------------------------------------------------------
# Switch panes using Alt-arrow without needing to hit the prefix key first
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Increase scrollback history limit to 50,000 lines (Great for long AI outputs)
set-option -g history-limit 50000

